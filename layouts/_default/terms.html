{{ define "main" }}
{{ $data := .Data }}
<div class="content container">
  {{ range .Data.Terms.ByCount }}
    <details class="term">
      <summary>
        <span>{{ .Name }}</span>
        <span class="badge">{{ .Count }}</span>
      </summary>
      <ul>
        <li><a href="{{ $data.Plural | absLangURL }}/{{ .Name | urlize }}/">Ver todos</a></li>
        {{ range .WeightedPages }}
          <li><a href="{{ .Permalink }}">{{ .Title }}</a></li>
        {{ end }}
      </ul>
    </details>
  {{ end }}
</div>
{{ end }}
