{{ define "main" }}
  <div class="content container">
    {{ with .Content }}
      <section class="card prose">
        {{.}}
      </section>
    {{ end }}

    <div class="posts-list">
      {{ range .Paginator.Pages }}
        {{ partial "post_preview.html" .}}
      {{ end }}
    </div>

    {{ partial "pager.html" . }}
  </div>
{{ end }}
