{{ if or (.Paginator.HasPrev) (.Paginator.HasNext) }}
<nav class="pager" aria-label="Paginação">
  {{ if .Paginator.HasPrev }}
    <a class="btn btn-secondary" rel="prev" href="{{ .Paginator.Prev.URL }}">&larr; {{ i18n "newerPosts" }}</a>
  {{ else }}<span></span>{{ end }}
  {{ if .Paginator.HasNext }}
    <a class="btn btn-secondary" rel="next" href="{{ .Paginator.Next.URL }}">{{ i18n "olderPosts" }} &rarr;</a>
  {{ end }}
</nav>
{{ end }}
