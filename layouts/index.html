{{ define "main" }}
  <div class="content container">
    {{ with .Content }}
      <section class="card prose">
        {{.}}
      </section>
    {{ end }}

    <div class="posts-list">
      {{ $pag := .Paginate (where site.RegularPages "Type" "in" site.Params.mainSections) }}
      {{ range $pag.Pages }}
        {{ partial "post_preview" . }}
      {{ end }}
    </div>

    {{ partial "pager.html" . }}
  </div>
{{ end }}
